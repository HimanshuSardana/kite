<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ .Title }}{{ if .SiteTitle }} — {{ .SiteTitle }}{{ end }}" />
<title>{{ .Title }}{{ if .SiteTitle }} — {{ .SiteTitle }}{{ end }}</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<style>
:root{
  --bg:#f4f1ea;--surface:#fff;--text:#1c1a17;--body:#3d3a34;--muted:#6f6a60;--faint:#a8a29a;
  --border:#e2ddd2;--code-bg:#202226;--code-text:#dfddd9;--accent:#3c7878;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font-family:var(--serif);font-size:19px;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 1.25rem}
.topbar{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;padding:1rem 1.5rem;font-family:var(--sans);font-size:.85rem}
.brand{font-weight:700;color:var(--text);text-decoration:none}
.prose{padding:2rem 0}
.prose h1{color:var(--text);font-size:2rem;line-height:1.2;letter-spacing:-.02em;margin:.5rem 0 1rem}
.prose h2{color:var(--text);font-size:1.35rem;margin:2.2em 0 .4em}
.prose p{margin:.9em 0}
.prose a{color:var(--accent)}
.prose code{font-family:var(--mono);font-size:.85em}
.prose :not(pre)>code{background:#e9e4d8;padding:.1em .4em;border-radius:6px}
.prose pre:not(.scrolly-code){background:var(--code-bg);color:var(--code-text);border-radius:12px;padding:1rem 1.2rem;overflow:auto;font-size:.82rem;margin:1.3em 0}
/* ---- scrolly ---- */
html,body{overflow-x:clip}
.scrolly{width:100%;margin:0 0 2rem;position:relative;display:block}
.scrolly-stage-col{position:sticky;top:0;z-index:5;height:54vh;background:var(--code-bg);margin-left:calc(50% - 50vw);width:100vw}
.scrolly-sticky{height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden}
.scrolly-stage{flex:1;min-height:0;width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scrolly-stage pre.scrolly-code{margin:0;width:100%;max-width:900px;max-height:100%;overflow:auto;background:var(--code-bg);color:var(--code-text);font-family:var(--mono);font-size:15px;line-height:1.8;padding:2rem 1.5rem}
.scrolly-stage pre code{display:block}
.s-line{white-space:pre;transition:opacity .3s}
.s-line.dim{opacity:.28}
.s-line.enter{animation:s-in .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes s-in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.scrolly-tex{color:var(--code-text);font-size:1.3rem;padding:1rem;overflow-x:auto;max-width:100%}
.scrolly-tex.fade{animation:s-fade .35s ease both}
@keyframes s-fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scrolly-combo{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:1.2rem;width:100%;max-width:900px;max-height:100%;min-height:0}.scrolly-combo .scrolly-tex{padding:0.2rem 0.5rem}.scrolly-combo pre.scrolly-code{margin:0}
.scrolly-tikzmount{min-height:60px;display:flex;justify-content:center;align-items:center}
.scrolly-tikzmount .tikz{margin:0;min-height:60px;display:flex;align-items:center;justify-content:center}
.scrolly-tikzmount .tikz svg{max-width:100%;max-height:30vh;width:auto;height:auto;filter:invert(1) hue-rotate(180deg)}
.tikz-placeholder{display:flex;align-items:center;gap:.6rem;color:rgba(223,221,217,.45);font-family:var(--sans);font-size:.82rem}
.tikz-spinner{width:18px;height:18px;flex:0 0 auto;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.6);animation:tikz-spin .9s linear infinite}
@keyframes tikz-spin{to{transform:rotate(360deg)}}
figure.tikz:not(.tikz-loading) .tikz-placeholder,figure.tikz.tikz-failed .tikz-spinner{display:none}
.scrolly-scene{display:flex;justify-content:center;min-height:0}
.scrolly-scene svg{width:min(100%,440px);height:auto;max-height:30vh}
.scrolly-dots{flex:0 0 auto;display:flex;gap:6px;justify-content:center;padding:.7rem 0 1.1rem}
.scrolly-dot{width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.22)}
.scrolly-dot.on{background:#fff}
.scrolly-prose-col{padding:2rem 0 30vh}
.scrolly-step{min-height:60vh;padding:1.5rem 0;border-left:3px solid transparent}
.scrolly-step p{margin:.9em 0}
.scrolly-step code{color:var(--accent)}
@media screen and (min-width:1000px){
  .scrolly{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);display:grid;grid-template-columns:50vw minmax(0,1fr);gap:0;align-items:start}
  .scrolly-stage-col{width:auto;min-width:0;margin-left:0;position:static;height:auto;align-self:stretch;background:none}
  .scrolly-sticky{position:sticky;top:0;height:100vh;height:100svh;background:var(--code-bg);border-radius:0}
  .scrolly-stage pre.scrolly-code{max-width:760px}
  .scrolly-combo{max-width:760px}
  .scrolly-prose-col{padding:12vh clamp(2rem,5vw,5rem) 30vh;max-width:46rem}
  .scrolly-step{min-height:70vh}
}
footer{border-top:1px solid var(--border);margin-top:3rem;padding:1.5rem 0 2.5rem;font-size:.8rem;font-family:var(--sans);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.s-line.enter,.scrolly-tex.fade{animation:none}}
</style>
<script>
window.MathJax = { tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']], processEscapes: true }, options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }, chtml: { scale: 1.04 } };
</script>
<script async id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
<link href="https://tikzjax.com/v1/fonts.css" rel="stylesheet" />
<script src="https://tikzjax.com/v1/tikzjax.js"></script>
<script>
// Capture TikZJax's on-load renderer so step diagrams compile on demand.
window.__kiteTikzRender = null;
try {
  if (typeof window.onload === 'function') { window.__kiteTikzRender = window.onload; }
} catch (e) {}
window.onload = null;
</script>
</head>
<body>
<div class="topbar"><a class="brand" href="../">{{ if .SiteTitle }}{{ .SiteTitle }}{{ else }}kite{{ end }}</a><span>scrollytelling</span></div>
<div class="wrap">
<main class="prose">
<h1>{{ .Title }}</h1>
{{ .Content }}
</main>
<footer><span>&copy; {{ .Year }}{{ if .AuthorName }} {{ .AuthorName }}{{ end }}</span></footer>
</div>
<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function stepHTML(steps, n){
    var st = steps[Math.max(0, Math.min(n, steps.length-1))];
    var sc = st.scene ? '<div class="scrolly-scene" data-scene="'+n+'"></div>' : '';
    var fig = st.tikz ? '<div class="scrolly-tikzmount" data-tikz="'+n+'"></div>' : '';
    var tex = st.tex ? '<div class="scrolly-tex fade">$$'+esc(st.tex)+'$$</div>' : '';
    if (st.lang === 'tex' || st.lang === 'tikzfig' || st.lang === 'scene') return sc + fig + tex;
    var h = '<pre class="scrolly-code"><code>';
    (st.lines || []).forEach(function(ln){
      var t = ln.text.trim() === '' ? ' ' : ln.text;
      h += '<div class="s-line'+(ln.focus?'':' dim')+'" data-lid="'+esc(ln.id)+'"><span>'+esc(t)+'</span></div>';
    });
    h += '</code></pre>';
    if (sc || fig || tex) return '<div class="scrolly-combo">' + sc + fig + tex + h + '</div>';
    return h;
  }
  // TikZ figures: compiled once per step, then the node is moved into the
  // stage on each visit (moving preserves the compiled svg, no recompile).
  var tikzPool = {};
  function activateTikz(fig){
    var src = fig.querySelector('script.tikz-source');
    if (src && !fig.querySelector('svg')) {
      var live = document.createElement('script');
      live.type = 'text/tikz';
      live.textContent = src.textContent;
      src.parentNode.replaceChild(live, src);
      var fn = window.__kiteTikzRender;
      if (typeof fn === 'function') { try { fn(); } catch (e) {} }
    }
  }
  function mountTikz(root, stage, idx, steps){
    var mount = stage.querySelector('[data-tikz="'+idx+'"]');
    if (!mount || !steps[idx] || !steps[idx].tikz) return;
    var fig = tikzPool[idx];
    if (!fig) {
      fig = document.createElement('figure');
      fig.className = 'tikz tikz-loading';
      var ph = document.createElement('div');
      ph.className = 'tikz-placeholder';
      ph.setAttribute('aria-hidden', 'true');
      var spin = document.createElement('span');
      spin.className = 'tikz-spinner';
      var label = document.createElement('span');
      label.textContent = 'Rendering diagram\u2026';
      ph.appendChild(spin); ph.appendChild(label);
      var src = document.createElement('script');
      src.type = 'text/plain';
      src.className = 'tikz-source';
      src.textContent = steps[idx].tikz;
      fig.appendChild(ph); fig.appendChild(src);
      tikzPool[idx] = fig;
      setTimeout(function(){
        if (fig.classList.contains('tikz-loading') && !fig.querySelector('svg')) {
          fig.classList.add('tikz-failed');
          label.textContent = 'Diagram failed to load.';
        }
      }, 30000);
    }
    mount.appendChild(fig);
    activateTikz(fig);
  }
  function typeset(el){
    if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([el]).catch(function(){}); }
  }
  // Manim-lite scene engine: one persistent SVG per story. Each step only
  // declares *state*; boxes are keyed (stack:index) across steps, so pushes
  // drop in, pops float away, and kept boxes never move. LaTeX-free, KBs.
  function parseScene(src){
    var stacks = [];
    (src || '').split('\n').forEach(function(line){
      var m = line.match(/^\s*stack\s+([A-Za-z_]\w*)\s*:\s*\[(.*)\]\s*(?:highlight\s*=\s*(\S+))?\s*$/);
      if (!m) return;
      var vals = m[2].trim() ? m[2].split(',').map(function(x){ return x.trim(); }) : [];
      stacks.push({ name: m[1], values: vals, hl: (m[3] || 'none').toLowerCase() });
    });
    return stacks;
  }
  var SC = { boxW: 116, boxH: 42, gap: 76, padX: 24, padTop: 88, labelH: 46,
    ink: '#dfddd9', faint: 'rgba(223,221,217,0.28)', hl: '#5ec8b8', boxFill: '#26292e' };
  function ScenePlayer(allStates){
    var order = [], maxDepth = {};
    allStates.forEach(function(sts){
      (sts || []).forEach(function(s){
        if (order.indexOf(s.name) < 0) order.push(s.name);
        maxDepth[s.name] = Math.max(maxDepth[s.name] || 0, s.values.length);
      });
    });
    var md = 1;
    order.forEach(function(nm){ md = Math.max(md, maxDepth[nm] || 0); });
    var W = SC.padX * 2 + order.length * SC.boxW + (order.length - 1) * SC.gap;
    var H = SC.padTop + md * SC.boxH + SC.labelH;
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('role', 'img');
    function x0(i){ return SC.padX + i * (SC.boxW + SC.gap); }
    function yOf(j){ return SC.padTop + (md - 1 - j) * SC.boxH; }
    order.forEach(function(name, i){
      for (var j = 0; j < (maxDepth[name] || 0); j++) {
        var r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', x0(i)); r.setAttribute('y', yOf(j));
        r.setAttribute('width', SC.boxW); r.setAttribute('height', SC.boxH);
        r.setAttribute('fill', 'none'); r.setAttribute('stroke', SC.faint);
        r.setAttribute('stroke-dasharray', '5 4');
        svg.appendChild(r);
      }
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x0(i) + SC.boxW / 2);
      t.setAttribute('y', SC.padTop + md * SC.boxH + 27);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', SC.ink);
      t.setAttribute('font-size', '17'); t.setAttribute('font-style', 'italic');
      t.textContent = name;
      svg.appendChild(t);
    });
    var live = {};
    function resolveHl(s, vals){
      if (s.hl === 'top') return vals.length ? vals.length - 1 : -1;
      var n = parseInt(s.hl, 10);
      if (!isNaN(n) && n >= 0 && n < vals.length) return n;
      return -1;
    }
    function mkBox(name, j, value){
      var i = order.indexOf(name);
      var g = document.createElementNS(NS, 'g');
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x0(i)); r.setAttribute('y', yOf(j));
      r.setAttribute('width', SC.boxW); r.setAttribute('height', SC.boxH);
      r.setAttribute('fill', SC.boxFill);
      r.setAttribute('stroke', SC.ink); r.setAttribute('stroke-width', '1.5');
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x0(i) + SC.boxW / 2);
      t.setAttribute('y', yOf(j) + SC.boxH / 2 + 6);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', SC.ink);
      t.setAttribute('font-size', '17'); t.setAttribute('font-family', 'ui-monospace,Menlo,Consolas,monospace');
      t.textContent = value;
      g.appendChild(r); g.appendChild(t); svg.appendChild(g);
      return { g: g, rect: r, txt: t, value: value };
    }
    function goto(stacks, animate){
      var want = {};
      stacks.forEach(function(s){ want[s.name] = s.values; });
      Object.keys(live).forEach(function(k){
        var p = k.split(':'), arr = want[p[0]] || [];
        if (+p[1] >= arr.length) {
          var dead = live[k]; delete live[k];
          if (animate) {
            var a = dead.g.animate(
              [{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-64px)', opacity: 0 }],
              { duration: 300, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' });
            a.onfinish = function(){ if (dead.g.parentNode) dead.g.parentNode.removeChild(dead.g); };
          } else if (dead.g.parentNode) dead.g.parentNode.removeChild(dead.g);
        }
      });
      order.forEach(function(name){
        var s = null;
        stacks.forEach(function(x){ if (x.name === name) s = x; });
        var vals = s ? s.values : [];
        var hl = s ? resolveHl(s, vals) : -1;
        vals.forEach(function(v, j){
          var k = name + ':' + j;
          if (!live[k]) {
            live[k] = mkBox(name, j, v);
            if (animate) live[k].g.animate(
              [{ transform: 'translateY(-72px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }],
              { duration: 380, easing: 'cubic-bezier(.2,.7,.2,1)' });
          } else if (live[k].value !== v) {
            live[k].value = v; live[k].txt.textContent = v;
            if (animate) live[k].g.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: 240 });
          }
          live[k].rect.setAttribute('stroke', (j === hl) ? SC.hl : SC.ink);
          live[k].rect.setAttribute('stroke-width', (j === hl) ? '3' : '1.5');
        });
      });
    }
    function hide(){ if (svg.parentNode) svg.parentNode.removeChild(svg); }
    return { svg: svg, goto: goto, hide: hide };
  }
  document.querySelectorAll('.scrolly').forEach(function(root){
    var dataEl = root.querySelector('.scrolly-data');
    if (!dataEl) return;
    var steps;
    try { steps = JSON.parse(dataEl.textContent); } catch(e){ return; }
    var stage = root.querySelector('.scrolly-stage');
    var dots = Array.prototype.slice.call(root.querySelectorAll('.scrolly-dot'));
    var sections = Array.prototype.slice.call(root.querySelectorAll('.scrolly-step'));
    var cur = 0, animating = false;
    var sceneStates = steps.map(function(x){ return x.scene ? parseScene(x.scene) : null; });
    var player = sceneStates.some(function(x){ return !!x; }) ? ScenePlayer(sceneStates) : null;
    function syncScene(n){
      if (!player) return;
      if (steps[n] && steps[n].scene) {
        var m = stage.querySelector('[data-scene="'+n+'"]');
        if (m) { m.appendChild(player.svg); player.goto(sceneStates[n], !reduce); }
      } else player.hide();
    }
    typeset(stage);
    function go(n){
      n = Math.max(0, Math.min(n, steps.length-1));
      if (n === cur || animating && n === cur) return;
      // FLIP for code: capture old line boxes by lid
      var oldBoxes = {};
      stage.querySelectorAll('.s-line').forEach(function(el){ oldBoxes[el.getAttribute('data-lid')] = el.getBoundingClientRect(); });
      cur = n;
      stage.innerHTML = stepHTML(steps, n);
      dots.forEach(function(d,i){ d.classList.toggle('on', i===n); });
      if (!reduce) {
        stage.querySelectorAll('.s-line').forEach(function(el){
          var lid = el.getAttribute('data-lid');
          var old = oldBoxes[lid];
          if (old) {
            var now = el.getBoundingClientRect();
            var dy = old.top - now.top;
            if (Math.abs(dy) > 1) {
              el.animate([{transform:'translateY('+dy+'px)'},{transform:'none'}],{duration:320,easing:'cubic-bezier(.2,.7,.2,1)'});
            }
          } else {
            el.classList.add('enter');
          }
        });
      }
      typeset(stage);
      mountTikz(root, stage, n, steps);
      syncScene(n);
    }
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (e.isIntersecting) go(parseInt(e.target.getAttribute('data-step'),10)||0);
      });
    }, { rootMargin: '-40% 0px -40% 0px' });
    sections.forEach(function(s){ io.observe(s); });
    var tikzDone = new MutationObserver(function(muts){
      muts.forEach(function(m){
        Array.prototype.forEach.call(m.addedNodes, function(n){
          var svg = (n.tagName === 'SVG') ? n : (n.querySelector && n.querySelector('svg'));
          if (!svg) return;
          var fig = (n.tagName === 'SVG') ? n.parentNode : n;
          while (fig && !(fig.classList && fig.classList.contains('tikz'))) fig = fig.parentNode;
          if (fig) fig.classList.remove('tikz-loading');
        });
      });
    });
    tikzDone.observe(stage, { childList: true, subtree: true });
    mountTikz(root, stage, cur, steps);
    syncScene(cur);
    root.setAttribute('data-ready', sections.length + '/' + steps.length);
  });
})();
</script>
</body>
</html>
